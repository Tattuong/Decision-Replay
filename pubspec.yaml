name: decision_replay
description: Decision Replay — capture, replay and remember your notes.

publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.3
  uuid: ^4.1.0
  in_app_purchase: ^3.2.1
  http: ^1.2.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  home_widget: ^0.7.0
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon_foreground.png
